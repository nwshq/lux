name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Architecture lint
        run: npm run lint:architecture

      - name: Architecture tests
        run: npm run test:architecture

      - name: Dead code check
        run: npm run validate:dead-code

  release:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package release tarball
        run: |
          # Assemble tarball: dist + package files + bin wrapper
          # NO node_modules — consumer runs npm ci --omit=dev to compile
          # native modules (e.g. better-sqlite3) for their Node version
          mkdir -p lux-release/bin

          cp -r dist lux-release/
          cp package.json package-lock.json lux-release/
          cp bin/lux lux-release/bin/
          chmod +x lux-release/bin/lux

          tar -czf lux-linux-x64.tar.gz -C lux-release .

          rm -rf lux-release

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
