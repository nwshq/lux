name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Reject tracked credentials and generated output
        run: bash scripts/verify-repository-hygiene.sh

      - name: Scan fetched branch and tag history for secrets
        run: bash scripts/scan-secrets.sh

      - name: Mutation-test security gates
        run: bash scripts/test-security-gates.sh

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Enforce conventional PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR title: $PR_TITLE"
          if [[ ! "$PR_TITLE" =~ ^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([[:alnum:]_.\/-]+\))?(!)?:\ .+ ]]; then
            echo "PR title must follow Conventional Commits, e.g. feat(experts): add overlay routing"
            exit 1
          fi

  ci:
    needs: [secret-scan, pr-title]
    if: always() && needs.secret-scan.result == 'success' && (github.event_name != 'pull_request' || needs.pr-title.result == 'success')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --maxWorkers=1 --no-file-parallelism

      - name: Architecture lint
        run: npm run lint:architecture

      - name: Architecture tests
        run: npm run test:architecture

      - name: Docs and Agent Skill surface check
        run: npm run verify:docs-surface

      - name: Dead code check
        run: npm run validate:dead-code

      - name: Native-free check
        run: npm run verify:native-free
